name: VoltPRo Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/validate-components.js
      - name: Install PLC workstation dependencies
        run: npm ci
        working-directory: apps/voltpro-plc
      - name: Test PLC scan engine
        run: npm test
        working-directory: apps/voltpro-plc
      - name: Type-check and build PLC workstation
        run: npm run build
        working-directory: apps/voltpro-plc
