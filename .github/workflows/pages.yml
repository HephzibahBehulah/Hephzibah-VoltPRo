name: Deploy VoltPRo Academy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node for VoltProPLC
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build VoltProPLC
        working-directory: apps/voltpro-plc
        run: |
          npm ci
          npm test
          npm run build

      - name: Stage the public site
        run: |
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='apps' ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
